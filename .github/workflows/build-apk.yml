name: Build DevToolbox Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      JAVA_VERSION: '17'
      ANDROID_PLATFORM: 'android-35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK: '26.3.11579264'
      CMAKE_VERSION: '3.22.1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "DevToolbox_APK_Analyzer_Project.zip"
            "DevToolbox.zip"
            "APKAnalyzer.zip"
            "DevToolbox_Project.zip"
          )
          ARCHIVE=""
          for f in "${candidates[@]}"; do
            if [[ -f "$f" ]]; then
              ARCHIVE="$f"
              break
            fi
          done
          if [[ -z "$ARCHIVE" ]]; then
            echo "No supported project ZIP found in repository root." >&2
            echo "Expected one of: ${candidates[*]}" >&2
            exit 1
          fi
          echo "Using archive: $ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Unpack project
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "${{ steps.archive.outputs.archive }}" -d project

          PROJECT_ROOT=""
          while IFS= read -r -d '' f; do
            candidate="$(dirname "$f")"
            if [[ -f "$candidate/settings.gradle.kts" || -f "$candidate/settings.gradle" ]]; then
              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print0)

          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "Could not locate extracted Gradle project." >&2
            find project -maxdepth 3 -type f | sort >&2
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept all Android SDK licenses non-interactively
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null 2>&1 || true

      - name: Install fixed Android SDK/NDK/CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${CMAKE_VERSION}"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK outputs
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging "$DEBUG_APK" > /tmp/badging.txt
          grep -q "package: name='com.devtoolbox.app'" /tmp/badging.txt

          echo "Debug APK:"
          ls -lh "$DEBUG_APK"
          echo "Release APK:"
          ls -lh "$RELEASE_APK"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevToolbox-APK
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/app-release-unsigned.apk
