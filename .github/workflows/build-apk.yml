name: Build Cowboy Runner Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Godot project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="CowboyRunnerGodot.zip"

          test -f "$ZIP_FILE"
          rm -rf .godot_project
          mkdir -p .godot_project
          unzip -q "$ZIP_FILE" -d .godot_project

      - name: Find Godot project
        id: find-project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/.godot_project" -type f -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          test -f "$PROJECT_DIR/export_presets.cfg"

          RELATIVE_PROJECT_DIR="${PROJECT_DIR#$GITHUB_WORKSPACE/}"
          echo "project_dir=$RELATIVE_PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Godot project: $RELATIVE_PROJECT_DIR"

      - name: Build Android ARM64
        id: build
        uses: mlm-games/godot-build-action@v1.3.1
        with:
          GODOT_VER: "4.7.2-stable"
          EXPORT_PRESET_NAME: "Android arm64"
          PROJECT_DIR: "${{ steps.find-project.outputs.project_dir }}"
          EXPORT_DIR: "builds"
          DEBUG_MODE: "false"
          GODOT_PREVIEW_BUILDS: "false"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Build output: ${{ steps.build.outputs.build }}"
          find "${{ steps.build.outputs.build }}" -type f -name '*.apk' -print
          test -n "$(find "${{ steps.build.outputs.build }}" -type f -name '*.apk' -print -quit)"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cowboy-runner-android-arm64
          path: ${{ steps.build.outputs.build }}/**/*.apk
          if-no-files-found: error
