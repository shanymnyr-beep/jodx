name: Build DevToolbox Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      JAVA_VERSION: '17'
      ANDROID_PLATFORM: 'android-35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK: '26.3.11579264'
      CMAKE_VERSION: '3.22.1'

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Find project archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=""
          for f in DevToolbox.zip APKAnalyzer.zip DevToolbox_Project.zip; do
            if [[ -f "$f" ]]; then ARCHIVE="$f"; break; fi
          done
          if [[ -z "$ARCHIVE" ]]; then
            echo "No project ZIP found in repository root." >&2
            exit 1
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q "${{ steps.archive.outputs.archive }}" -d project
          ROOT=$(find project -maxdepth 2 -type f -name settings.gradle.kts -o -name settings.gradle | head -n1 | xargs -r dirname)
          if [[ -z "$ROOT" || ! -f "$ROOT/settings.gradle.kts" && ! -f "$ROOT/settings.gradle" ]]; then
            echo "Could not locate extracted Gradle project." >&2
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install fixed Android SDK/NDK/CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${CMAKE_VERSION}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Validate Gradle wrapper
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Run tests
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK outputs
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lah app/build/outputs/apk/debug/
          ls -lah app/build/outputs/apk/release/
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk >/tmp/badging.txt
          grep -q "package: name='com.devtoolbox.app'" /tmp/badging.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevToolbox-APK
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
