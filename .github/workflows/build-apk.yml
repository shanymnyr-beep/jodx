name: Build Godot Android Game

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract game archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _game build
          mkdir -p _game

          ARCHIVE="$(find . -maxdepth 2 -type f \( -iname '*.zip' -o -iname '*.ZIP' \) ! -path './_game/*' | head -n 1)"
          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No game ZIP found in repository root."
            exit 1
          fi

          echo "Using game archive: $ARCHIVE"
          unzip -q "$ARCHIVE" -d _game

          ROOT="$(find _game -maxdepth 4 -type f -name project.godot -print -quit)"
          if [ -z "$ROOT" ]; then
            echo "ERROR: project.godot not found after extraction."
            find _game -maxdepth 4 -type f | head -150
            exit 1
          fi

          PROJECT_DIR="$(dirname "$ROOT")"
          cp -a "$PROJECT_DIR" build
          rm -rf build/.godot build/output
          mkdir -p "$GITHUB_WORKSPACE/build/output"

          test -f build/project.godot
          test -f build/export_presets.cfg
          grep -q 'platform="Android"' build/export_presets.cfg

          echo "Project directory: $PROJECT_DIR"
          echo "Build directory: $GITHUB_WORKSPACE/build"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest"

      - name: Generate debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          curl -L --fail --retry 5 --retry-delay 2 \
            -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
          godot --version | grep -q "4.7.2.stable"

      - name: Install matching Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          TEMPLATE_VERSION="${GODOT_VERSION}.stable"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"

          rm -rf "$TEMPLATES_DIR" /tmp/godot_templates
          mkdir -p "$TEMPLATES_DIR" /tmp/godot_templates

          curl -L --fail --retry 5 --retry-delay 2 \
            -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d /tmp/godot_templates

          DEBUG_TEMPLATE="$(find /tmp/godot_templates -type f -name 'android_debug.apk' -print -quit)"
          RELEASE_TEMPLATE="$(find /tmp/godot_templates -type f -name 'android_release.apk' -print -quit)"
          SOURCE_TEMPLATE="$(find /tmp/godot_templates -type f -name 'android_source.zip' -print -quit)"

          test -n "$DEBUG_TEMPLATE"
          test -n "$RELEASE_TEMPLATE"
          test -n "$SOURCE_TEMPLATE"

          cp "$DEBUG_TEMPLATE" "$TEMPLATES_DIR/android_debug.apk"
          cp "$RELEASE_TEMPLATE" "$TEMPLATES_DIR/android_release.apk"
          cp "$SOURCE_TEMPLATE" "$TEMPLATES_DIR/android_source.zip"
          printf '%s\n' "$TEMPLATE_VERSION" > "$TEMPLATES_DIR/version.txt"

          echo "Installed Godot templates:"
          ls -lh "$TEMPLATES_DIR"

      - name: Configure Godot Android environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" << SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Validate Godot project
        shell: bash
        working-directory: build
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/build/output/City-Wanderer-debug.apk"
          mkdir -p "$(dirname "$OUTPUT")"
          rm -f "$OUTPUT"

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          godot --headless \
            --path "$GITHUB_WORKSPACE/build" \
            --export-debug "Android" \
            "$OUTPUT" 2>&1

          test -f "$OUTPUT"
          echo "APK generated successfully:"
          ls -lh "$OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: City-Wanderer-Android
          path: build/output/City-Wanderer-debug.apk
          if-no-files-found: error
