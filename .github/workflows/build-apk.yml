name: Build Cowboy Runner Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare clean Godot environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/.config/godot"
          echo "Clean Godot environment prepared."

      - name: Extract Godot project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="CowboyRunnerGodot.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            exit 1
          fi

          rm -rf .godot_project
          mkdir -p .godot_project

          unzip -q "$ZIP_FILE" -d .godot_project

          echo "ZIP extracted successfully."

      - name: Find Godot project
        id: find-project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find \
            "$GITHUB_WORKSPACE/.godot_project" \
            -type f \
            -name "project.godot" \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg not found."
            exit 1
          fi

          RELATIVE_PROJECT_DIR="${PROJECT_DIR#$GITHUB_WORKSPACE/}"

          echo "Found project:"
          echo "$RELATIVE_PROJECT_DIR"

          echo "project_dir=$RELATIVE_PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Android export configuration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.find-project.outputs.project_dir }}"

          echo "Checking project.godot..."

          grep -q \
            '^textures/vram_compression/import_etc2_astc=true$' \
            "$PROJECT_DIR/project.godot"

          echo "Checking Android preset..."

          grep -q \
            '^name="Android arm64"$' \
            "$PROJECT_DIR/export_presets.cfg"

          echo "Checking export path..."

          grep -q \
            '^export_path="builds/cowboy_runner_android_arm64.apk"$' \
            "$PROJECT_DIR/export_presets.cfg"

          echo "Android export configuration verified."

      - name: Build Android ARM64
        id: build
        uses: mlm-games/godot-build-action@v1.3.1
        with:
          GODOT_VER: "4.7.2-stable"
          EXPORT_PRESET_NAME: "Android arm64"
          PROJECT_DIR: "${{ steps.find-project.outputs.project_dir }}"
          EXPORT_DIR: "builds"
          DEBUG_MODE: "false"
          GODOT_PREVIEW_BUILDS: "false"

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find \
            "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -not -path "*/.git/*" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cowboy-runner-android-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
