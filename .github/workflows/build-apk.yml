name: Build Cowboy Runner Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      XDG_CONFIG_HOME: ${{ runner.temp }}/godot-config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare clean Godot config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$XDG_CONFIG_HOME"
          mkdir -p "$XDG_CONFIG_HOME"

      - name: Extract Godot project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="CowboyRunnerGodot.zip"
          test -f "$ZIP_FILE"

          rm -rf .godot_project
          mkdir -p .godot_project

          unzip -q "$ZIP_FILE" -d .godot_project

      - name: Find Godot project
        id: find-project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/.godot_project"             -type f -name "project.godot" -print -quit)"

          test -n "$PROJECT_FILE"

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          test -f "$PROJECT_DIR/export_presets.cfg"

          RELATIVE_PROJECT_DIR="${PROJECT_DIR#$GITHUB_WORKSPACE/}"

          echo "Godot project: $RELATIVE_PROJECT_DIR"
          echo "project_dir=$RELATIVE_PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Android ETC2/ASTC setting
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.find-project.outputs.project_dir }}"

          grep -q '^textures/vram_compression/import_etc2_astc=true$'             "$PROJECT_DIR/project.godot"

          grep -q '^name="Android arm64"$'             "$PROJECT_DIR/export_presets.cfg"

          grep -q '^export_path="builds/cowboy_runner_android_arm64.apk"$'             "$PROJECT_DIR/export_presets.cfg"

          echo "Android export configuration verified."

      - name: Build Android ARM64
        id: build
        uses: mlm-games/godot-build-action@v1.3.1
        with:
          GODOT_VER: "4.7.2-stable"
          EXPORT_PRESET_NAME: "Android arm64"
          PROJECT_DIR: "${{ steps.find-project.outputs.project_dir }}"
          EXPORT_DIR: "builds"
          DEBUG_MODE: "false"
          GODOT_PREVIEW_BUILDS: "false"

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$GITHUB_WORKSPACE"             -type f -name '*.apk'             -not -path '*/.git/*'             -print -quit)"

          test -n "$APK"

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cowboy-runner-android-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
