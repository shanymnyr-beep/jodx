name: Build Godot Android Game

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract game archive
        shell: bash
        run: |
          set -e
          mkdir -p _game
          ARCHIVE="$(find . -maxdepth 2 -type f \( -iname '*.zip' -o -iname '*.ZIP' \) ! -path './_game/*' | head -n 1)"
          if [ -z "$ARCHIVE" ]; then
            echo "No game ZIP found in repository root."
            exit 1
          fi
          echo "Using: $ARCHIVE"
          unzip -q "$ARCHIVE" -d _game
          ROOT="$(find _game -maxdepth 3 -name project.godot -print -quit)"
          if [ -z "$ROOT" ]; then
            echo "project.godot not found after extraction."
            find _game -maxdepth 3 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$ROOT")"
          rm -rf build
          cp -a "$PROJECT_DIR" build
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Godot 4.4
        shell: bash
        run: |
          set -e
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4-stable_linux.x86_64
          sudo mv Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Godot Android export templates
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.4.stable"
          mkdir -p "$TEMPLATES_DIR"
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          unzip -q templates.tpz -d /tmp/godot_templates
          # Copy all Android-related template files
          find /tmp/godot_templates -type f \( -name '*.apk' -o -name 'android_source.zip' \) \
            -exec cp {} "$TEMPLATES_DIR/" \;
          echo "Templates installed:"
          ls "$TEMPLATES_DIR/"

      - name: Configure Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Export Android APK
        run: |
          mkdir -p build/output
          godot --headless --path build --export-debug "Android" build/output/City-Wanderer-debug.apk 2>&1 || {
            echo "=== Godot export failed — checking logs ==="
            find "$HOME/.local/share/godot/logs" -type f -exec cat {} \; 2>/dev/null || true
            exit 1
          }
          if [ ! -f build/output/City-Wanderer-debug.apk ]; then
            echo "APK not generated!"
            exit 1
          fi
          echo "APK size: $(du -sh build/output/City-Wanderer-debug.apk)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: City-Wanderer-Android
          path: build/output/City-Wanderer-debug.apk
          if-no-files-found: error
